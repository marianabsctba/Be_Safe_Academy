name: Atualizar Cyber Jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: write

concurrency:
  group: cyber-jobs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar vagas brasileiras
        run: python update_jobs.py

      - name: Mostrar resultado
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/jobs.json",encoding="utf-8"))
          print("TOTAL:",len(p.get("items",[])))
          print("FONTES:",p.get("sources",{}))
          print("TRILHAS:")
          tracks={}
          for x in p.get("items",[]):
              tracks[x.get("track","?")]=tracks.get(x.get("track","?"),0)+1
          print(tracks)
          assert len(p.get("items",[])) > 0
          PY

      - name: Publicar atualização
        run: |
          git config user.name "Be Safe Jobs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "jobs: radar BR multi-fonte v4"
          git push
